# The iPhone app. Generate the Xcode project with:  cd iOS && xcodegen
# It links PixoraCore from the package at the repository root, so face matching, the library, Private Space
# and export behave exactly as on the Mac. The Mac app is still built by scripts/build_app.sh.
name: PixoraPhone
options:
  bundleIdPrefix: local.pixora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Pixora:
    path: ..
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PixoraPhone:
    type: application
    platform: iOS
    sources:
      - path: PixoraPhone
      # Face models (built locally by tools/convert_*.py, not in git). Xcode compiles them into the app.
      - path: ../Models/SCRFD10G.mlpackage
        optional: true
      - path: ../Models/ArcFaceR50.mlpackage
        optional: true
    dependencies:
      - package: Pixora
        product: PixoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pixora.Pixora
        PRODUCT_NAME: Pixora
        TARGETED_DEVICE_FAMILY: "1"
        COREML_CODEGEN_LANGUAGE: None
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: PixoraPhone/Info.plist
      properties:
        CFBundleDisplayName: Pixora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Pixora reads only the photos you pick, to find the people in them. It never changes or deletes anything in your Photos library.
        NSHumanReadableCopyright: Made by Mithin Sagar · MIT License (bundled face models are for non-commercial use)
  PixoraPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PixoraPhoneUITests]
    dependencies:
      - target: PixoraPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pixora.PixoraPhoneUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PixoraPhone
schemes:
  PixoraPhone:
    build:
      targets:
        PixoraPhone: all
        PixoraPhoneUITests: [test]
    test:
      targets: [PixoraPhoneUITests]
